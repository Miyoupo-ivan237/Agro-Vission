$kind: http-request
method: POST
url: '{{baseUrl}}/api/ai/recommend'
order: 1000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "location": "Yaoundé, Cameroon",
      "season": "Rainy",
      "soilCondition": "Loamy",
      "landSize": "2 Hectares",
      "priority": "yield",
      "language": "English"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response has success flag", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("success");
      });
      pm.test("Response has recommendation", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("recommendation");
      });
      pm.test("Recommendation has primaryCrop", function () {
          const json = pm.response.json();
          if (json.success && json.recommendation) {
              pm.expect(json.recommendation).to.have.property("primaryCrop");
          }
      });
